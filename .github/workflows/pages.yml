# The site on GitHub Pages: the page from site/ on main, and setup.sh from the v1 tag. It's built
# again when either changes: a push to main that touches the site, or a release moving v1, which
# starts it on main (scripts/release.sh). Always from main: the github-pages environment only lets
# main deploy, and a run started by the tag would be refused.
name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, examples/**, scripts/site.sh, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Built and deployed in two jobs, as GitHub's own Pages workflows are: deploying in the job that
  # uploaded can look for the artifact before it's listed ("No artifacts named github-pages"), and
  # re-running that job then finds two ("Multiple artifacts"). A failed deploy can be re-run alone.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # for the v1 tag
      - run: bash scripts/site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
